name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with pytest
        run: python -m pytest --tb=short -q
      - name: Lint with ruff
        run: ruff check .
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'
      - name: Install build
        run: python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ['web/template/wiki_theme.css', 'wikimolgen/rendering/jmolcolors.csv']
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f'FAIL: wheel {wheel} is missing required files: {missing}')
          print(f'OK: wheel {wheel} contains all required runtime data files')
          EOF
